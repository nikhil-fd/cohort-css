<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        #container{
            display: grid;
            grid-template-rows: repeat(3, 100px);
            grid-template-columns: repeat(3, 454px);
            width: 100vw;
            height: 100vh;
            border: 2px solid black;
        }
        header{
            border: 2px solid red;
            grid-row: 1 / 2;
            grid-column: 1 / 4;
        }
        main{
            border: 2px solid green;
            grid-row: 2 / 3;
            grid-column: 1 / 3;
            height: 400px;
        }
        aside{
            border: 2px solid blue;
            height: 400px;
        }
        footer{
            border: 2px solid red;
            grid-row: 3 / 4;
            grid-column: 1 / 4;
        }
    </style>
</head>
<body>
    <div id="container">
        <header>amazon</header>
    <main>content</main>
    <aside>ads</aside>
    <footer>copyright</footer>
    </div>
</body>
</html>
