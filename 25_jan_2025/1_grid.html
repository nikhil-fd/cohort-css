<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .parent{
            border: 2px solid;
            display: grid;
            grid-template-rows: repeat(4, 30px);
            grid-template-columns: repeat(4, 40px);
            /* "grid-template-areas" - shortest way of grid-template-rows and grid-template-columns */
            grid-template-areas: 
            "header header header"
            "main main ads"
            "section section section";
            grid-gap: 10px;
        }
        .child{
            border: 1px dashed;
        }
        .item-1{
            background-color: red;
            /* grid-row-start: 1;
            grid-row-end: 5;
            grid-column-start: 1;
            grid-column-end: 2; */

            /* 👆shorter👇 */
            /* grid-row: 1 / 5;
            grid-column: 1 / 2; */

            /* 👆shortest👇 */
            grid-area: 1 / 1 / 5 / 2;
            /*👌grid-area: row-start / col-start / row-end / col-end; 
            Follow this short way -- */

           
        }
        .item-2{
            grid-row-start: 1;
            grid-row-end: 5;
            grid-column-start: 3;
            grid-column-end: 5;
            background-color: blue;
        }
        .item-4{
            grid-row-start: 4;
            grid-row-end: 5;
            grid-column-start: 4;
            grid-column-end: 5;
            background-color: yellow;
        }
        .item-3{
            grid-row-start: 3;
            grid-row-end: 4;
            grid-column-start: 4;
            grid-column-end: 5;
            background-color: chartreuse;
        }
        .item-6{
            grid-row-start: 3;
            grid-row-end: 5;
            grid-column-start: 2;
            grid-column-end: 3;
            background-color: aqua;
        }
        .item-5{
            grid-column-end: span 4;
            /*👆 it will expand/spread/streteh 4 column from where item5 placed to till 4column */
            background-color: gray;
            font-size: 2em;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child item-1">item1</div>
        <div class="child item-2">item2</div>
        <div class="child item-3">item3</div> 
        <div class="child item-4">item4</div>
        <div class="child item-5">item5</div>
        <div class="child item-6">item6</div>
    </div>
</body>
</html>
