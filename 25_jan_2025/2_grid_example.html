<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid example</title>
    <style>
        #parent{
            width: 100vw;
            height: 100vh;
            border: 2px solid;
            display: grid;
            grid-template-areas: 
            "h h h"
            "m m ads"
            "m m ads"
            "f f f";
            /*👆 total 4 row & 3 col */
        }
        header{
            /* width: 100vw; */
            /* height: 100px; */
            border: 4px solid blue;
            text-align: center;
            grid-area: 1 / 1 / 2 / -1;
            /*👆 grid-area: row-start / col-start / row-end / col-end; */
        }
        main{
            border: 4px solid red;
            grid-area: 2 / 1 / 4 / 3 ;
            text-align: center;
        }
        aside{
            border: 4px solid green;
            grid-area: 2 / 3 / 4 / 4;
        }
        footer{
            border: 4px solid springgreen;
            grid-area: 4 / 1 / -1 / -1;
        }
    </style>
</head>
<body>
    <div id="parent">
        <header>Header</header>
        <main>Main</main>
        <aside>ads</aside>
        <footer>footer</footer>
    </div>
</body>
</html>
