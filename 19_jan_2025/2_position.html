<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position</title>
    <style>
        #ludo-box{
            width: 700px;
            height: 400px;
            border: 2px solid gray;
            position: relative;
        }
       .box{
        position: absolute;
        width: 50px;
        height: 50px;
        border-radius: 50%;
       }
       .top-left-red{
        background-color: red;
        top: 0;
        left: 0;
       }
      .bottom-right-yellow{
        background-color: yellow;
        bottom: 0;
        right: 0;
      }
      .top-right-green{
        background-color: green;
        top: 0;
        right: 0;
      }
      .bottom-left-blue{
        background-color: blue;
        bottom: 0;
        left: 0;
      }
    </style>
</head>
<body>
    <div id="ludo-box">
        <div class="box top-left-red"></div>
        <div class="box bottom-right-yellow"></div>
        <div class="box top-right-green"></div>
        <div class="box bottom-left-blue"></div>
    </div>
</body>
</html>
